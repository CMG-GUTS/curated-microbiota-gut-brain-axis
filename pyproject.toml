[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "curated-microbiota-gut-brain-axis"
version = "0.1.0"
description = "Versioned multimodal microbiota-gut-brain axis benchmark collections"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "CMG-GUTS" }]
keywords = ["microbiota", "gut-brain-axis", "multimodal", "benchmark", "neuroimaging"]
dependencies = ["platformdirs>=4.3"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "build>=1.2"]

[project.urls]
Homepage = "https://github.com/CMG-GUTS/curated--microbiota-gut-brain-axis"
Repository = "https://github.com/CMG-GUTS/curated--microbiota-gut-brain-axis"
Issues = "https://github.com/CMG-GUTS/curated--microbiota-gut-brain-axis/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["curated_microbiota_gut_brain_axis*"]

[tool.setuptools.package-data]
curated_microbiota_gut_brain_axis = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
